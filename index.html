<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>受付QRスキャン</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
  <h2>QRコードをかざしてください</h2>
  <div id="reader" style="width:300px;"></div>

  <!-- 成功時の効果音（自由に音源URLを差し替え可能） -->
  <audio id="successSound" src="https://cdn.jsdelivr.net/gh/hajimehoshi/oto/sample/beep.mp3" preload="auto"></audio>

  <script>
    function onScanSuccess(qrCodeMessage) {
      // 音を鳴らす
      const sound = document.getElementById("successSound");
      sound.play().catch(e => {
        console.log("音声再生に失敗しました:", e);
      });

      const memberId = encodeURIComponent(qrCodeMessage);
      const secretKey = "abc123"; // iPadからのみ送るキー
      const url = `https://script.google.com/macros/s/AKfycbywUsVJegJFdfbJW3gLrVk9XTCjMDijUmNV7NqL-gvlSV2JfxF_GsWjcDRz4PzGsvuG/exec?id=${memberId}&key=${secretKey}`;

      fetch(url)
        .then(response => response.text())
        .then(data => alert(data))
        .catch(err => alert("送信エラー"));
    }

    new Html5Qrcode("reader").start(
      { facingMode: "user" },
      { fps: 10, qrbox: 250 },
      onScanSuccess
    );
  </script>
</body>
</html>

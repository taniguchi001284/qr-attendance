<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>受付QRスキャン</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
  <h2>QRコードをかざしてください</h2>
  <div id="reader" style="width:300px;"></div>

<script>
  function onScanSuccess(qrMessage) {
    const img = new Image();
    img.src = qrMessage + "&ts=" + new Date().getTime(); // キャッシュ防止のためタイムスタンプ付加
    img.onload = () => alert("出席記録が完了しました");
    img.onerror = () => alert("送信に失敗しました");
  }
</script>
  
</body>
</html>
